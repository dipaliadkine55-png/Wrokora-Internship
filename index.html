<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Coffee Rating</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <header>

            <h1>☕ Coffee Rating</h1>

            <p>
                Vote for your favorite coffee.
            </p>

        </header>


        <!-- Coffee cards -->

        <section>

            <div
                id="coffeeContainer"
                class="coffee-grid"
            ></div>

        </section>


        <!-- Leaderboard -->

        <section class="leaderboard">

            <h2>🏆 Top Rated Coffee</h2>

            <div id="leaderboard"></div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
