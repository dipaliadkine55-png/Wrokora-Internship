<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick Notes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📝 Quick Notes</h1>

        <form id="noteForm">

            <input
                type="text"
                id="title"
                placeholder="Note title"
                required
            >

            <textarea
                id="content"
                placeholder="Write your note..."
                required
            ></textarea>

            <button type="submit">
                Add Note
            </button>

        </form>

        <input
            type="text"
            id="search"
            placeholder="Search notes..."
        >

        <div id="notes"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
