<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JWT Authentication</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;

            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 12px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 12px;

            margin-top: 8px;

            border: none;

            border-radius: 7px;

            background: #667eea;

            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        .logout {
            background: #dc3545;
        }

        .message {
            margin-top: 20px;

            padding: 12px;

            border-radius: 7px;

            background: #f1f1f1;
        }

        .profile {
            margin-top: 20px;

            padding: 15px;

            background: #f5f5f5;

            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🔐 User Authentication</h1>


        <!-- Register -->

        <h2>Register</h2>

        <input
            id="registerName"
            type="text"
            placeholder="Name"
        >

        <input
            id="registerEmail"
            type="email"
            placeholder="Email"
        >

        <input
            id="registerPassword"
            type="password"
            placeholder="Password"
        >

        <button onclick="register()">
            Register
        </button>


        <hr style="margin: 25px 0;">


        <!-- Login -->

        <h2>Login</h2>

        <input
            id="loginEmail"
            type="email"
            placeholder="Email"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>


        <!-- Protected route -->

        <button onclick="getProfile()">
            View Protected Profile
        </button>


        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>


        <div
            id="message"
            class="message"
        >
            Please register or login.
        </div>

    </div>

</div>


<script>

    const message =
        document.getElementById(
            "message"
        );


    // Register
    async function register() {

        const name =
            document.getElementById(
                "registerName"
            ).value;

        const email =
            document.getElementById(
                "registerEmail"
            ).value;

        const password =
            document.getElementById(
                "registerPassword"
            ).value;


        const response =
            await fetch(
                "/api/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        name,
                        email,
                        password
                    })
                }
            );


        const data =
            await response.json();

        message.textContent =
            data.message;
    }


    // Login
    async function login() {

        const email =
            document.getElementById(
                "loginEmail"
            ).value;

        const password =
            document.getElementById(
                "loginPassword"
            ).value;


        const response =
            await fetch(
                "/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        email,
                        password
                    })
                }
            );


        const data =
            await response.json();

        message.textContent =
            data.message;
    }


    // Protected route
    async function getProfile() {

        const response =
            await fetch(
                "/api/profile",
                {
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (response.ok) {

            message.innerHTML = `
                <div class="profile">

                    <strong>
                        Welcome
                        ${data.user.name}
                    </strong>

                    <br><br>

                    Email:
                    ${data.user.email}

                </div>
            `;

        } else {

            message.textContent =
                data.message;
        }
    }


    // Logout
    async function logout() {

        const response =
            await fetch(
                "/api/auth/logout",
                {
                    method: "POST",

                    credentials: "include"
                }
            );


        const data =
            await response.json();

        message.textContent =
            data.message;
    }

</script>

</body>

</html>
